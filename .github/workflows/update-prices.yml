name: Update market prices

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_prices.py'
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write

concurrency:
  group: market-price-update
  cancel-in-progress: true

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check yfinance pandas requests
      - name: Update previous-close prices
        run: python scripts/update_prices.py
      - name: Commit price files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json web-v1/prices.json docs/market-indexes.json web-v1/market-indexes.json docs/fund-prices.json web-v1/fund-prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
            exit 0
          fi
          git commit -m "Update market prices"
          git pull --rebase origin main
          git push origin HEAD:main
