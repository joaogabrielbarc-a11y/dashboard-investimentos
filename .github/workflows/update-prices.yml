name: Update market prices

on:
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_prices.py'
      - '.github/workflows/update-prices.yml'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check yfinance pandas requests
      - name: Update previous-close prices
        run: python scripts/update_prices.py
      - name: Commit price file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/prices.json web-v1/prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "Update market prices"
            git push
          fi
